# Drop-in style cupsd.conf fragment guidance — applied by bootstrap.
# CUPS listens only on localhost; LAN clients use drukarka IPP proxy :631.
# Auth: drukarka's passkey gate is the only user-facing auth. cupsd trusts
# loopback (the HTTPS wrap) and must not prompt for a second Basic password.

LogLevel warn
PageLogFormat

# Only local socket / loopback — never the LAN.
Listen localhost:8631
Listen /run/cups/cups.sock

Browsing On
BrowseLocalProtocols dnssd

WebInterface Yes

<Location />
  Order allow,deny
  Allow localhost
</Location>

<Location /admin>
  Order allow,deny
  Allow localhost
</Location>

<Location /admin/conf>
  Order allow,deny
  Allow localhost
</Location>

<Policy default>
  JobPrivateAccess default
  JobPrivateValues default
  SubscriptionPrivateAccess default
  SubscriptionPrivateValues default
  <Limit All>
    Order deny,allow
    Allow localhost
  </Limit>
</Policy>
